<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Tema: projetos elétricos e plantas técnicas */
:root {
  --bg: #07111c;
  --bg-gradient: radial-gradient(circle at 50% 0%, #102942 0%, #07111c 68%);
  --panel: rgba(11, 27, 42, 0.88);
  --panel-hover: rgba(16, 39, 59, 0.96);
  --line: rgba(75, 184, 220, 0.22);
  --line-hover: rgba(255, 190, 65, 0.65);
  --blue: #ffbf43;
  --blue2: #55d6f2;
  --text: #eff7fc;
  --muted: #9bb0bf;
}

/* Grade sutil, inspirada em plantas e diagramas técnicos */
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(21, 67, 96, 0.5), transparent 65%),
    linear-gradient(rgba(85, 214, 242, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(85, 214, 242, 0.045) 1px, transparent 1px),
    linear-gradient(rgba(85, 214, 242, 0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(85, 214, 242, 0.018) 1px, transparent 1px);
  background-size:
    auto,
    40px 40px,
    40px 40px,
    8px 8px,
    8px 8px;
  background-attachment: fixed;
}

/* Cabeçalho com acabamento de painel técnico */
header {
  background: rgba(5, 14, 23, 0.94);
  border-bottom-color: rgba(85, 214, 242, 0.28);
}

.brand {
  color: var(--blue);
  text-shadow: 0 0 14px rgba(255, 191, 67, 0.28);
}

nav a:hover {
  color: var(--blue);
  text-shadow: 0 0 10px rgba(255, 191, 67, 0.35);
}

.lang {
  border-color: var(--line);
}

.lang button.active {
  background: var(--blue);
  color: #101820;
}

/* Títulos com destaque de sinalização elétrica */
h1 span,
.contact-title span {
  color: var(--blue);
  text-shadow: 0 0 24px rgba(255, 191, 67, 0.25);
}

.eyebrow,
.index,
.summary-title,
.card-number,
.education-status {
  color: var(--blue);
}

/* Cartões com contorno azul e detalhe amarelo ao passar o mouse */
.summary,
.card,
.education-item {
  border-color: var(--line);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
}

.card {
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 28px;
  width: 42px;
  height: 2px;
  background: var(--blue);
  opacity: 0.8;
}

.card:hover,
.education-item:hover {
  border-color: var(--line-hover);
}

.card:hover::before {
  width: 76px;
  transition: width 0.25s ease;
}

/* Botão principal com aparência de destaque de painel */
.button.primary {
  background: linear-gradient(135deg, #ffd16e, #f2a91d);
  color: #101820;
  box-shadow: 0 4px 18px rgba(255, 191, 67, 0.2);
}

.button.primary:hover {
  background: linear-gradient(135deg, #ffe09a, #ffc247);
  box-shadow: 0 6px 22px rgba(255, 191, 67, 0.35);
}

.button.secondary:hover {
  border-color: var(--blue2);
  color: var(--blue2);
}

/* Habilidades no estilo de etiquetas técnicas */
.skill {
  border-color: rgba(85, 214, 242, 0.25);
  color: var(--blue2);
}

.skill:hover {
  border-color: var(--blue);
  background: rgba(255, 191, 67, 0.08);
  box-shadow: 0 4px 14px rgba(255, 191, 67, 0.12);
}

/* Links e separadores de contato */
.contact-row {
  border-bottom-color: var(--line);
}

.contact-row a:hover {
  color: var(--blue);
  text-shadow: 0 0 10px rgba(255, 191, 67, 0.28);
}

section,
footer {
  border-color: var(--line);
}

    <section id="personal">

    <section id="contact">

      <div class="contact">

        <div>
          <div class="contact-row"><span class="label" data-i18n="contact.phoneLabel"></span><a href="tel:+5522999031808">(22) 99903-1808</a></div>

  </main>

        hero: {
          eyebrow:"Portfólio Profissional",
          role:"Engenharia Elétrica · Projetos Elétricos · Desenvolvimento Full Stack",
          text:"Profissional em formação, com base técnica em Eletrotécnica e estudos atuais em Engenharia Elétrica e Ciência da Computação.",

        },
        summary: {
          title:"Resumo Profissional", locationLabel:"Localização", location:"Campos dos Goytacazes, RJ, Brasil",
          educationLabel:"Formação", education:"Engenharia Elétrica · Ciência da Computação",

        },

        },
        skills:["Linux","Python","C / C++","Git","GitHub","Programação","Engenharia Elétrica","Eletrotécnica","Eletrônica"],
        personal: {
          title:"Fora da Carreira",
          p1:{title:"Focado, Objetivo e Tranquilo",text:"Sou uma pessoa focada, objetiva e tranquila. Prefiro pensar com clareza e tomar decisões práticas."},

        },
        contact: { title:"Contato", headline:'Vamos <span>Conversar.</span>', phoneLabel:"Telefone", availabilityLabel:"Disponibilidade", availability:"Disponível para oportunidades de estágio" },
        footer:{focus:"Engenharia Elétrica · Projetos Elétricos · Desenvolvimento Full Stack"}
      }
    };

    const nav = document.getElementById("nav");
    const skills = document.getElementById("skills");
    const nodes = document.querySelectorAll("[data-i18n]");
    const buttons = document.querySelectorAll("[data-lang]");

    function get(obj, path) { 
      return path.split(".").reduce((v, k) => (v && v[k] !== undefined) ? v[k] : "", obj); 
    }

    function render(lang) {
      const x = t[lang] || t.pt;
      nodes.forEach(n => {
        const val = get(x, n.dataset.i18n);
        if (val) n.innerHTML = val;
      });
      
      nav.innerHTML = `
        <a href="#about">${x.nav.about}</a>
        <a href="#experience">${x.nav.experience}</a>
        <a href="#projects">${x.nav.projects}</a>
        <a href="#education">${x.nav.education}</a>
        <a href="#personal">${x.nav.personal}</a>
        <a href="#contact">${x.nav.contact}</a>`;
        
      skills.innerHTML = x.skills.map(s => `<span class="skill">${s}</span>`).join("");
      buttons.forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
      
      document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
      document.title = lang === "pt" ? "Otávio Leite — Portfólio" : "Otávio Leite — Portfolio";
      localStorage.setItem("preferred_lang", lang);
    }

    buttons.forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));

    const savedLang = localStorage.getItem("preferred_lang") || "pt";
    render(savedLang);
  </script>
</body>
