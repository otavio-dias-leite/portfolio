<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Otávio Leite — Engenharia Elétrica, Projetos Elétricos e Desenvolvimento Full Stack.">
  <title>Otávio Leite — Portfólio</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #07111c;
      --bg-gradient: radial-gradient(ellipse at 50% 0%, #0f2842 0%, #07111c 75%);
      --panel: rgba(11, 27, 42, 0.75);
      --panel-border: rgba(85, 214, 242, 0.2);
      --panel-hover: rgba(16, 39, 59, 0.88);
      --line: rgba(75, 184, 220, 0.2);
      --line-hover: rgba(255, 191, 67, 0.7);
      --amber: #ffbf43;
      --amber-glow: rgba(255, 191, 67, 0.25);
      --cyan: #55d6f2;
      --cyan-glow: rgba(85, 214, 242, 0.2);
      --text: #eff7fc;
      --muted: #9bb0bf;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(21, 67, 96, 0.45), transparent 70%),
        linear-gradient(rgba(85, 214, 242, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85, 214, 242, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(85, 214, 242, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85, 214, 242, 0.015) 1px, transparent 1px);
      background-size:
        100% 100%,
        40px 40px,
        40px 40px,
        10px 10px,
        10px 10px;
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Layout Utility Classes */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    section {
      padding: 5rem 0;
      border-bottom: 1px dashed var(--line);
      position: relative;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      transition: border-color 0.3s ease;
    }

    header .container.header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--amber);
      text-decoration: none;
      letter-spacing: 1px;
      text-shadow: 0 0 12px var(--amber-glow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand::before {
      content: "⚡";
      font-size: 1.1rem;
    }

    nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.25s ease;
    }

    nav a:hover {
      color: var(--amber);
      text-shadow: 0 0 10px var(--amber-glow);
    }

    /* Language Switcher */
    .lang {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(11, 27, 42, 0.6);
    }

    .lang button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang button.active {
      background: var(--amber);
      color: #07111c;
      font-weight: 700;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 2.5rem;
      align-items: center;
      padding: 6rem 0 4rem;
      border-bottom: 1px dashed var(--line);
    }

    .eyebrow {
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .eyebrow::before {
      content: "//";
      color: var(--amber);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    h1 span {
      color: var(--amber);
      text-shadow: 0 0 20px var(--amber-glow);
    }

    .role {
      font-family: var(--font-mono);
      color: var(--cyan);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .intro {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: var(--font-body);
    }

    .button.primary {
      background: linear-gradient(135deg, #ffd16e, #f2a91d);
      color: #07111c;
      box-shadow: 0 4px 20px var(--amber-glow);
      border: 1px solid var(--amber);
    }

    .button.primary:hover {
      background: linear-gradient(135deg, #ffe09a, #ffc247);
      box-shadow: 0 6px 26px rgba(255, 191, 67, 0.45);
      transform: translateY(-2px);
    }

    .button.secondary {
      background: rgba(11, 27, 42, 0.6);
      color: var(--text);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
    }

    .button.secondary:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 4px 18px var(--cyan-glow);
      transform: translateY(-2px);
    }

    /* Sidebar Summary Panel */
    .summary {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .summary::before {
      content: "SPECIFICATIONS";
      position: absolute;
      top: -10px;
      right: 20px;
      background: var(--bg);
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--amber);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
    }

    .summary-title {
      font-family: var(--font-heading);
      color: var(--amber);
      font-size: 1rem;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(85, 214, 242, 0.1);
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-row .label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .summary-row .value {
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .index {
      font-family: var(--font-mono);
      color: var(--amber);
      font-size: 1.25rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* Modern Grids */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .grid.three-cols {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    /* Cards */
    .card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--cyan);
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--line-hover);
      background: var(--panel-hover);
      transform: translateY(-4px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    .card:hover::before {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber-glow);
    }

    .card-number {
      font-family: var(--font-mono);
      color: var(--amber);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: rgba(255, 191, 67, 0.1);
      border-radius: 4px;
      border: 1px solid rgba(255, 191, 67, 0.2);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    .card p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    /* About Section Specific Layout */
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .lead {
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--cyan);
      line-height: 1.4;
    }

    .text p {
      color: var(--muted);
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .education {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .education-item {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.25rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      transition: all 0.3s ease;
    }

    .education-item:hover {
      border-color: var(--cyan);
      background: var(--panel-hover);
      transform: translateX(4px);
    }

    .education-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--amber);
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      background: rgba(255, 191, 67, 0.1);
      border: 1px solid rgba(255, 191, 67, 0.25);
      border-radius: 4px;
      white-space: nowrap;
    }

    .education-title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
    }

    .education-place {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Skills Badges */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .skill {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--cyan);
      border: 1px solid rgba(85, 214, 242, 0.3);
      background: rgba(11, 27, 42, 0.5);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      transition: all 0.25s ease;
      cursor: default;
    }

    .skill:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(255, 191, 67, 0.08);
      box-shadow: 0 4px 14px var(--amber-glow);
      transform: translateY(-2px);
    }

    .contact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2.5rem;
    }

    .contact-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      line-height: 1.2;
    }

    .contact-title span {
      color: var(--amber);
      text-shadow: 0 0 20px var(--amber-glow);
    }

    .contact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-row:last-child {
      border-bottom: none;
    }

    .contact-row .label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .contact-row a, .contact-row span:not(.label) {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    .contact-row a:hover {
      color: var(--amber);
      text-shadow: 0 0 10px var(--amber-glow);
    }

    /* Footer */
    footer {
      padding: 2.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer strong {
      color: var(--amber);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 3rem 0;
      }
      .two {
        grid-template-columns: 1fr;
      }
      .contact {
        grid-template-columns: 1fr;
        padding: 1.75rem;
      }
    }

    @media (max-width: 768px) {
      header .container.header {
        flex-wrap: wrap;
        height: auto;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
        gap: 0.75rem;
      }
      nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
        padding-bottom: 0.25rem;
        gap: 1rem;
      }
      nav a {
        white-space: nowrap;
        font-size: 0.8rem;
      }
      .education-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
      footer {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

  <header>
    <div class="container header">
      <a class="brand" href="#home">Otávio Leite</a>
      <nav id="nav" aria-label="Navegação principal"></nav>

        <button type="button" data-lang="en">EN</button>

      </div>

  <main id="home" class="container">
