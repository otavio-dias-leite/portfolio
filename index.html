  <style>
    :root {
      --bg: #061326;
      --bg-gradient: radial-gradient(ellipse at 50% 0%, #0b2b55 0%, #061326 75%);
      --panel: rgba(24, 15, 39, 0.75);
      --panel-border: rgba(77, 163, 255, 0.2);
      --panel-hover: rgba(36, 20, 54, 0.88);
      --line: rgba(77, 163, 255, 0.22);
      --line-hover: rgba(77, 163, 255, 0.7);
      --purple: #4da3ff;
      --purple-glow: rgba(57, 139, 255, 0.25);
      --lavender: #91caff;
      --lavender-glow: rgba(77, 163, 255, 0.2);
      --text: #f2f8ff;
      --muted: #a8bad0;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(23, 105, 210, 0.30), transparent 70%),
        linear-gradient(rgba(77, 163, 255, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 163, 255, 0.055) 1px, transparent 1px),
        linear-gradient(rgba(77, 163, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(77, 163, 255, 0.018) 1px, transparent 1px);
      background-size:
        100% 100%,
        40px 40px,
        40px 40px,
        10px 10px,
        10px 10px;
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Layout Utility Classes */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    section {
      padding: 5rem 0;
      border-bottom: 1px dashed var(--line);
      position: relative;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 14, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      transition: border-color 0.3s ease;
    }

    header .container.header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .brand {
      position: relative;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--purple);
      text-decoration: none;
      letter-spacing: 1px;
      text-shadow: 0 0 12px var(--purple-glow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }


    nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.25s ease;
    }

    nav a:hover {
      color: var(--purple);
      text-shadow: 0 0 10px var(--purple-glow);
    }

    /* Language Switcher */
    .lang {
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(24, 15, 39, 0.6);
    }

    .lang button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang button.active {
      background: var(--purple);
      color: #061326;
      font-weight: 700;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 2.5rem;
      align-items: center;
      padding: 6rem 0 4rem;
      border-bottom: 1px dashed var(--line);
    }

    .eyebrow {
      color: var(--lavender);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .eyebrow::before {
      content: "//";
      color: var(--purple);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    h1 span {
      color: var(--purple);
      text-shadow: 0 0 20px var(--purple-glow);
    }

    .lock-icon {
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 auto;
      display: block;
      stroke: currentColor;
    }

    h1.glitch {
      position: relative;
      display: inline-block;
      isolation: isolate;
    }

    h1.glitch::before,
    h1.glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.62;
    }

    h1.glitch::before {
      color: #d9edff;
      animation: glitch-top 4.8s infinite steps(1);
    }

    h1.glitch::after {
      color: #398bff;
      animation: glitch-bottom 4.1s infinite steps(1);
    }

    @keyframes glitch-top {
      0%, 91%, 100% { clip-path: inset(0 0 82% 0); transform: translate(-2px, 0); }
      93% { clip-path: inset(18% 0 61% 0); transform: translate(3px, -1px); }
      95% { clip-path: inset(58% 0 24% 0); transform: translate(-3px, 1px); }
      97% { clip-path: inset(38% 0 43% 0); transform: translate(1px, 0); }
    }

    @keyframes glitch-bottom {
      0%, 88%, 100% { clip-path: inset(86% 0 0 0); transform: translate(2px, 0); }
      90% { clip-path: inset(22% 0 60% 0); transform: translate(-3px, 1px); }
      93% { clip-path: inset(64% 0 17% 0); transform: translate(2px, -1px); }
      96% { clip-path: inset(40% 0 39% 0); transform: translate(-1px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      h1.glitch::before,
      h1.glitch::after { animation: none; }
    }

    .role {
      font-family: var(--font-mono);
      color: var(--lavender);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .intro {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: var(--font-body);
    }

    .button.primary {
      background: linear-gradient(135deg, #91caff, #1769d2);
      color: #061326;
      box-shadow: 0 4px 20px var(--purple-glow);
      border: 1px solid var(--purple);
    }

    .button.primary:hover {
      background: linear-gradient(135deg, #d9edff, #65adff);
      box-shadow: 0 6px 26px rgba(57, 139, 255, 0.45);
      transform: translateY(-2px);
    }

    .button.secondary {
      background: rgba(24, 15, 39, 0.6);
      color: var(--text);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
    }

    .button.secondary:hover {
      border-color: var(--lavender);
      color: var(--lavender);
      box-shadow: 0 4px 18px var(--lavender-glow);
      transform: translateY(-2px);
    }

    /* Sidebar Summary Panel */
    .summary {
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .summary::before {
      content: "SPECIFICATIONS";
      position: absolute;
      top: -10px;
      right: 20px;
      background: var(--bg);
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--purple);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
    }

    .summary-title {
      font-family: var(--font-heading);
      color: var(--purple);
      font-size: 1rem;
      margin-bottom: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(77, 163, 255, 0.12);
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-row .label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .summary-row .value {
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .index {
      font-family: var(--font-mono);
      color: var(--purple);
      font-size: 1.25rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* Modern Grids */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .grid.three-cols {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    /* Cards */
    .card {
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--lavender);
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .card:hover {
      border-color: var(--line-hover);
      background: var(--panel-hover);
      transform: translateY(-4px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    .card:hover::before {
      background: var(--purple);
      box-shadow: 0 0 10px var(--purple-glow);
    }

    .card-number {
      font-family: var(--font-mono);
      color: var(--purple);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: rgba(57, 139, 255, 0.12);
      border-radius: 4px;
      border: 1px solid rgba(57, 139, 255, 0.22);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text);
    }

    .card p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    /* About Section Specific Layout */
    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .lead {
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--lavender);
      line-height: 1.4;
    }

    .text p {
      color: var(--muted);
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .education {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }

    .education-item {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.25rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      transition: all 0.3s ease;
    }

    .education-item:hover {
      border-color: var(--lavender);
      background: var(--panel-hover);
      transform: translateX(4px);
    }

    .education-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--purple);
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      background: rgba(57, 139, 255, 0.12);
      border: 1px solid rgba(57, 139, 255, 0.25);
      border-radius: 4px;
      white-space: nowrap;
    }

    .education-title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
    }

    .education-place {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Skills Badges */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .skill {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--lavender);
      border: 1px solid rgba(177, 128, 245, 0.3);
      background: rgba(24, 15, 39, 0.5);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      transition: all 0.25s ease;
      cursor: default;
    }

    .skill:hover {
      border-color: var(--purple);
      color: var(--purple);
      background: rgba(57, 139, 255, 0.10);
      box-shadow: 0 4px 14px var(--purple-glow);
      transform: translateY(-2px);
    }

    /* Contact */
    .contact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2.5rem;
    }

    .contact-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      line-height: 1.2;
    }

    .contact-title span {
      color: var(--purple);
      text-shadow: 0 0 20px var(--purple-glow);
    }

    /*
      CORREÇÃO:
      Mantém os rótulos alinhados à esquerda e os valores
      alinhados à direita. A coluna dos valores pode crescer
      e quebrar linha sem deslocar o restante.
    */
    .contact-row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-row:last-child {
      border-bottom: none;
    }

    .contact-row .label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      padding-top: 0.15rem;
    }

    .contact-row a,
    .contact-row span:not(.label) {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s ease;
      text-align: right;
      line-height: 1.5;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .contact-row a:hover {
      color: var(--purple);
      text-shadow: 0 0 10px var(--purple-glow);
    }

    /* Footer */
    footer {
      padding: 2.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer strong {
      color: var(--purple);
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 3rem 0;
      }

      .two {
        grid-template-columns: 1fr;
      }

      .contact {
        grid-template-columns: 1fr;
        padding: 1.75rem;
      }
    }

    @media (max-width: 768px) {
      header .container.header {
        flex-wrap: wrap;
        height: auto;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
        gap: 0.75rem;
      }

      nav {
        order: 3;
        width: 100%;
        overflow-x: auto;
        padding-bottom: 0.25rem;
        gap: 1rem;
      }

      nav a {
        white-space: nowrap;
        font-size: 0.8rem;
      }

      .education-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }

      footer {
        flex-direction: column;
        text-align: center;
      }
    }

    /*
      No celular, os dados de contato passam para duas linhas:
      Rótulo
      Valor
      Isso evita que Disponibilidade fique espremida.
    */
    @media (max-width: 600px) {
      .contact-row {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }

      .contact-row .label {
        padding-top: 0;
      }

      .contact-row a,
      .contact-row span:not(.label) {
        text-align: left;
      }
    }

    const nav = document.getElementById("nav");
    const skills = document.getElementById("skills");
    const nodes = document.querySelectorAll("[data-i18n]");

    function get(obj, path) {
      return path
        .split(".")
        .reduce(
          (v, k) =>
            (v && v[k] !== undefined)
              ? v[k]
              : "",
          obj
        );
    }

    function render(lang) {
      const selected = Object.prototype.hasOwnProperty.call(t, lang) ? lang : "pt";
      const x = t[selected];

      nodes.forEach(node => {
        const value = get(x, node.dataset.i18n);
        if (typeof value === "string" && value.length) {
          node.innerHTML = value;
        }
      });

      nav.innerHTML = [
        ["about", x.nav.about, "about"],
        ["experience", x.nav.experience, "experience"],
        ["projects", x.nav.projects, "projects"],
        ["education", x.nav.education, "education"],
        ["personal", x.nav.personal, "personal"],
        ["contact", x.nav.contact, "contact"]
      ].map(([id, label, href]) => '<a href="#' + href + '">' + label + '</a>').join("");

      skills.innerHTML = x.skills.map(skill => '<span class="skill">' + skill + '</span>').join("");

      document.documentElement.lang = selected === "pt" ? "pt-BR" : selected === "zh" ? "zh-CN" : "en-US";
      document.title = selected === "pt" ? "Otávio Leite — Portfólio" : selected === "zh" ? "Otávio Leite — 作品集" : "Otávio Leite — Portfolio";
    }

    function detectVisitorLanguage() {
      const locales = [...(navigator.languages || []), navigator.language || ""]
        .map(value => String(value).toLowerCase());
      if (locales.some(value => value.startsWith("pt-br"))) return "pt";
      if (locales.some(value => value.startsWith("zh"))) return "zh";
      return "en";
    }

    render(detectVisitorLanguage());
  </script>
