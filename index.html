<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Otávio Leite — Electrical Engineering, Electrical Projects and Full Stack Development portfolio.">
  <title>Otávio Leite — Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Deep premium dark theme */
      --bg: #030712; 
      --panel: rgba(255, 255, 255, 0.02);
      --line: rgba(255, 255, 255, 0.08);
      --blue: #38bdf8;
      --blue2: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --max: 1100px;
      --radius: 16px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { 
      scroll-behavior: smooth; 
      background: var(--bg);
    }
    
    body {
      font-family: "Inter", sans-serif;
      background-color: var(--bg);
      /* Subtle radial glows for premium background */
      background-image: 
        radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 90% 100%, rgba(129, 140, 248, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.7;
    }
    
    ::selection { background: rgba(56, 189, 248, 0.3); color: #fff; }
    
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    a { color: inherit; text-decoration: none; transition: color 0.3s; }
    
    /* Typography Overrides for Headings */
    h1, h2, h3, .brand, .eyebrow, .index, .card-number, .education-status, .section-title {
      font-family: "Orbitron", sans-serif;
    }

    .container { width: min(var(--max), 90%); margin: auto; }
    
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(3, 7, 18, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
    }
    
    .header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    
    .brand { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; color: var(--text); }
    
    nav { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    
    nav a { 
      font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; 
      color: var(--muted); position: relative; padding-bottom: 4px;
    }
    nav a::after {
      content: ''; position: absolute; width: 0%; height: 2px; bottom: 0; left: 0;
      background: linear-gradient(90deg, var(--blue), var(--blue2));
      transition: width 0.3s ease;
    }
    nav a:hover { color: var(--text); }
    nav a:hover::after { width: 100%; }

    .lang { display: flex; background: rgba(255, 255, 255, 0.03); border-radius: 24px; padding: 4px; border: 1px solid var(--line); gap: 4px; }
    .lang button {
      border: 0; background: transparent; color: var(--muted); padding: 6px 14px; 
      border-radius: 20px; font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer; transition: all 0.3s;
    }
    .lang button.active {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #030712; box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
    }

    main { width: min(var(--max), 90%); margin: auto; }
    
    section { padding: 100px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 84px; }
    
    .hero { min-height: calc(100vh - 76px); display: grid; grid-template-columns: 1.25fr .75fr; gap: 70px; align-items: center; }
    
    .eyebrow, .index { 
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; 
    }
    .eyebrow { margin-bottom: 20px; display: inline-block; }
    
    h1 { font-size: clamp(48px, 7vw, 84px); line-height: 1.05; letter-spacing: -2px; text-transform: uppercase; }
    h1 span { 
      display: block; 
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.15));
    }
    
    .role { margin-top: 24px; font-size: 20px; font-weight: 600; line-height: 1.6; color: var(--text); }
    .intro { max-width: 700px; margin-top: 16px; color: var(--muted); font-size: 16px; line-height: 1.9; }
    
    .actions { display: flex; gap: 14px; margin-top: 32px; flex-wrap: wrap; }
    
    .button {
      display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; 
      border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; 
      letter-spacing: 1.5px; text-transform: uppercase; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .button.primary {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border: none; color: #030712;
      box-shadow: 0 0 20px -5px rgba(56, 189, 248, 0.4);
    }
    .button.primary:hover {
      box-shadow: 0 0 30px -5px rgba(56, 189, 248, 0.6);
      transform: translateY(-3px);
    }
    .button.secondary {
      background: var(--panel); border: 1px solid var(--line);
      color: var(--text); backdrop-filter: blur(4px);
    }
    .button.secondary:hover {
      border-color: var(--blue); color: var(--blue);
      background: rgba(56, 189, 248, 0.05); transform: translateY(-3px);
    }

    .summary {
      padding: 32px; border: 1px solid var(--line); background: var(--panel); 
      border-radius: var(--radius); backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
    }
    .summary-title { margin-bottom: 24px; color: var(--text); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .summary-row { padding: 16px 0; border-top: 1px solid var(--line); }
    .summary-row:first-of-type { border-top: 0; padding-top: 0; }
    .label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
    .value { font-size: 14px; font-weight: 500; line-height: 1.6; color: var(--text); }

    .section-head { margin-bottom: 48px; }
    .section-title { margin-top: 10px; font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -1.5px; text-transform: uppercase; }
