<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Otávio Leite — Electrical Engineering, Electrical Projects and Full Stack Development portfolio.">
  <title>Otávio Leite — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#081625;--panel:#0d1d2d;--line:#1a364d;--blue:#4daee8;--blue2:#8dcfff;--text:#ecf6fd;--muted:#8aa1b3;--max:1100px}
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{font-family:"Orbitron",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
    a{color:inherit;text-decoration:none}
    .container{width:min(var(--max),90%);margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(8,22,37,.98);border-bottom:1px solid var(--line)}
    .header{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
    nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    nav a,.lang button{font:inherit;font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
    nav a{color:var(--muted)}
    nav a:hover{color:var(--blue2)}
    .lang{display:flex;border:1px solid var(--line)}
    .lang button{border:0;background:transparent;color:var(--muted);padding:7px 9px;cursor:pointer}
    .lang button.active{background:var(--blue);color:var(--bg)}
    main{width:min(var(--max),90%);margin:auto}
    section{padding:78px 0;border-bottom:1px solid var(--line);scroll-margin-top:84px}
    .hero{min-height:calc(100vh - 68px);display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:center}
    .eyebrow,.index{color:var(--blue);font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
    .eyebrow{margin-bottom:18px}
    h1{font-size:clamp(55px,8vw,96px);line-height:.95;letter-spacing:-2px;text-transform:uppercase}
    h1 span{display:block;color:var(--blue2)}
    .role{margin-top:22px;font-size:16px;font-weight:600;line-height:1.6}
    .intro{max-width:700px;margin-top:13px;color:var(--muted);font-size:10px;line-height:2}
    .actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
    .button{display:inline-flex;align-items:center;min-height:41px;padding:0 14px;border:1px solid var(--line);font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
    .button.primary{background:var(--blue);border-color:var(--blue);color:var(--bg)}
    .button.primary:hover{background:var(--blue2);border-color:var(--blue2)}
    .button.secondary:hover{border-color:var(--blue);color:var(--blue2)}
    .summary{padding:23px;border:1px solid var(--line);background:var(--panel)}
    .summary-title{margin-bottom:15px;color:var(--blue);font-size:8px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
    .summary-row{padding:12px 0;border-top:1px solid var(--line)}
    .summary-row:first-of-type{border-top:0}
    .label{display:block;margin-bottom:4px;color:var(--muted);font-size:7px;letter-spacing:1px;text-transform:uppercase}
    .value{font-size:9px;line-height:1.7}
    .section-head{margin-bottom:34px}
    .section-title{margin-top:7px;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-1.2px;text-transform:uppercase}
    .two{display:grid;grid-template-columns:.7fr 1.3fr;gap:70px}
    .lead{color:var(--blue2);font-size:18px;font-weight:600;line-height:1.45}
    .text{color:var(--muted);font-size:10px;line-height:2}
    .text p+p{margin-top:15px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .card{padding:22px;border:1px solid var(--line);background:var(--panel)}
    .card-number{margin-bottom:25px;color:var(--blue);font-size:8px;font-weight:700;letter-spacing:1.2px}
    .card h3{margin-bottom:7px;font-size:14px;line-height:1.5}
    .card p{color:var(--muted);font-size:9px;line-height:1.9}
    .education{display:grid;gap:8px}
    .education-item{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:20px 22px;border:1px solid var(--line);background:var(--panel)}
    .education-status{color:var(--blue);font-size:7px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
    .education-title{font-size:12px;font-weight:600}
    .education-place{margin-top:3px;color:var(--muted);font-size:8px}
    .skills{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
    .skill{padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:7px}
    .contact{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}
    .contact-title{font-size:clamp(42px,6vw,70px);line-height:1;letter-spacing:-2px;text-transform:uppercase}
    .contact-title span{color:var(--blue2)}
    .contact-row{padding:14px 0;border-bottom:1px solid var(--line)}
    .contact-row a,.contact-row>span:last-child{font-size:9px}
    .contact-row a:hover{color:var(--blue2)}
    footer{width:min(var(--max),90%);margin:auto;padding:23px 0 29px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:7px;letter-spacing:.8px;text-transform:uppercase}
    footer strong{color:var(--blue2)}
    @media(max-width:900px){nav{display:none}.hero,.two,.contact{grid-template-columns:1fr;gap:40px}.grid{grid-template-columns:1fr}}
    @media(max-width:620px){section{padding:62px 0}.hero{min-height:auto;padding-top:65px}h1{font-size:55px}.education-item{grid-template-columns:1fr;gap:7px}footer{flex-direction:column}}
  </style>
</head>
<body>
  <header>

        <article class="card"><div class="card-number">2022</div><h3 data-i18n="projects.p5.title"></h3><p data-i18n="projects.p5.text"></p></article>
      </div>
    </section>

    <section id="education">
      <div class="section-head"><div class="index">04</div><h2 class="section-title" data-i18n="education.title"></h2></div>
      <div class="education">
        <article class="education-item"><div class="education-status" data-i18n="education.e1.status"></div><div><div class="education-title" data-i18n="education.e1.title"></div><div class="education-place">IFF — Campos Centro Campus</div></div></article>
        <article class="education-item"><div class="education-status" data-i18n="education.e2.status"></div><div><div class="education-title" data-i18n="education.e2.title"></div><div class="education-place">IFF — Campos Centro Campus</div></div></article>
        <article class="education-item"><div class="education-status" data-i18n="education.e3.status"></div><div><div class="education-title" data-i18n="education.e3.title"></div><div class="education-place">Estácio de Sá</div></div></article>
      </div>
      <div class="skills" id="skills"></div>
    </section>

    <section id="personal">
      <div class="section-head"><div class="index">05</div><h2 class="section-title" data-i18n="personal.title"></h2></div>
      <div class="grid">
        <article class="card"><div class="card-number">01</div><h3 data-i18n="personal.p1.title"></h3><p data-i18n="personal.p1.text"></p></article>
        <article class="card"><div class="card-number">02</div><h3 data-i18n="personal.p2.title"></h3><p data-i18n="personal.p2.text"></p></article>
        <article class="card"><div class="card-number">03</div><h3 data-i18n="personal.p3.title"></h3><p data-i18n="personal.p3.text"></p></article>
      </div>
    </section>

    <section id="contact">
      <div class="section-head"><div class="index">06</div><h2 class="section-title" data-i18n="contact.title"></h2></div>
      <div class="contact">
        <div class="contact-title" data-i18n="contact.headline"></div>
        <div>
          <div class="contact-row"><span class="label" data-i18n="contact.phoneLabel"></span><a href="tel:+5522999031808">(22) 99903-1808</a></div>
          <div class="contact-row"><span class="label">Email</span><a href="mailto:o.otavio.dias.leite@gmail.com">o.otavio.dias.leite@gmail.com</a></div>
          <div class="contact-row"><span class="label">LinkedIn</span><a href="https://www.linkedin.com/in/otavio-dias-leite-976027366" target="_blank" rel="noopener noreferrer">Otávio Dias Leite</a></div>
          <div class="contact-row"><span class="label" data-i18n="contact.availabilityLabel"></span><span data-i18n="contact.availability"></span></div>
        </div>
      </div>
    </section>
  </main>

  <footer><span><strong>Otávio Leite</strong></span><span data-i18n="footer.focus"></span><span>2026</span></footer>

  <script>
    const t = {

        hero: {

        },
        projects: {

          p3:{title:"Arduino Temperature Monitoring",text:"Temperature monitoring using Arduino and Tinkercad, developed in 2024."},

        education: {

          e3:{status:"In Progress",title:"Bachelor's Degree in Computer Science"}
        },
        skills:["Linux","Python","C / C++","Git","GitHub","Programming","Electrical Engineering","Electrotechnics","Electronics"],
        personal: {

          p2:{title:"Music Production",text:"I enjoy music production and exploring creative ideas with sound."},

        },
        contact: { title:"Contact", headline:'Let\'s <span>Talk.</span>', phoneLabel:"Phone", availabilityLabel:"Availability", availability:"Available for internship opportunities" },
        footer:{focus:"Electrical Engineering · Electrical Projects · Full Stack Development"}
      },
      pt: {
        nav: { about:"Sobre", experience:"Experiência", projects:"Projetos", education:"Formação", personal:"Pessoal", contact:"Contato" },
        hero: {
          eyebrow:"Portfólio Profissional",
          role:"Engenharia Elétrica · Projetos Elétricos · Desenvolvimento Full Stack",
          text:"Profissional em formação, com base técnica em Eletrotécnica e estudos atuais em Engenharia Elétrica e Ciência da Computação.",
          projects:"Ver Projetos", contact:"Contato"
        },

          educationLabel:"Formação", education:"Engenharia Elétrica · Ciência da Computação",
          focusLabel:"Foco", focus:"Projetos Elétricos · Desenvolvimento Full Stack"
        },

        },

        contact: { title:"Contato", headline:'Vamos <span>Conversar.</span>', phoneLabel:"Telefone", availabilityLabel:"Disponibilidade", availability:"Disponível para oportunidades de estágio" },
        footer:{focus:"Engenharia Elétrica · Projetos Elétricos · Desenvolvimento Full Stack"}
      }
    };

    const nav = document.getElementById("nav");
    const skills = document.getElementById("skills");
    const nodes = document.querySelectorAll("[data-i18n]");
    const buttons = document.querySelectorAll("[data-lang]");

    function get(obj,path){ return path.split(".").reduce((v,k)=>v[k],obj); }

    function render(lang){
      const x = t[lang];
      nodes.forEach(n => n.innerHTML = get(x,n.dataset.i18n));
      nav.innerHTML = `
        <a href="#about">${x.nav.about}</a>
        <a href="#experience">${x.nav.experience}</a>
        <a href="#projects">${x.nav.projects}</a>
        <a href="#education">${x.nav.education}</a>
        <a href="#personal">${x.nav.personal}</a>
        <a href="#contact">${x.nav.contact}</a>`;
      skills.innerHTML = x.skills.map(s=>`<span class="skill">${s}</span>`).join("");
      buttons.forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
      document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
      document.title = lang === "pt" ? "Otávio Leite — Portfólio" : "Otávio Leite — Portfolio";
    }

    buttons.forEach(b=>b.addEventListener("click",()=>render(b.dataset.lang)));
    render("en");
  </script>
</body>
</html>
