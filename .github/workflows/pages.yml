name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "locale-router.js"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: .translation-cache.json
          key: ${{ runner.os }}-portfolio-i18n-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-portfolio-i18n-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build English source and localized static pages
        run: |
          mkdir -p dist
          npm install --no-save jsdom@26
          node scripts/render-static-source.js index.html dist/index.html
          cp robots.txt sitemap.xml locale-router.js dist/
          python scripts/build-static-translations.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
